name = "my-tg-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cron trigger for reminders + cron jobs + usage reports.
# "* * * * *" = every minute → reminders/cron jobs fire on time (±1 min).
# Cloudflare crons ALWAYS run in UTC (we convert per-user timezones in code).
[triggers]
crons = ["* * * * *"]

# KV namespace used for memory + per-chat settings + reminders.
# Create it once with:  npx wrangler kv namespace create MEMORY
# then paste the returned id below.
[[kv_namespaces]]
binding = "MEMORY"
id = "REPLACE_WITH_YOUR_KV_ID"

# ──────────────────────────────────────────────────────────────
# SECRETS — set with: npx wrangler secret put <NAME>
# At least ONE of these is required for the bot to work.
# The bot auto-falls back across all configured providers.
# ──────────────────────────────────────────────────────────────
# GEMINI_API_KEY      — https://aistudio.google.com/apikey
# GROQ_API_KEY        — https://console.groq.com/keys
# OPENROUTER_API_KEY  — https://openrouter.ai/keys
# MISTRAL_API_KEY     — https://console.mistral.ai/api-keys
# BYNARA_API_KEY      — https://router.bynara.id (custom endpoint)
# BOT_TOKEN           — from @BotFather on Telegram
# WEBHOOK_SECRET      — optional, for webhook security
#
# Optional for Google Search:
# GOOGLE_SEARCH_API_KEY — https://developers.google.com/custom-search/v1/overview
# GOOGLE_SEARCH_CX      — your Custom Search Engine ID
